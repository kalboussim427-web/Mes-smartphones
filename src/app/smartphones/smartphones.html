<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">
            <h2>Liste des Smartphones</h2>
            <hr>
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Modele</th>
                        <th>Prix</th>
                        <th>Date de Sortie</th>
                        <th>OS</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let smartphone of smartphones">
                        <td>{{ smartphone.idSmartphone }}</td>
                        <td>{{ smartphone.nomSmartphone }}</td>
                        <td>{{ smartphone.prixSmartphone }} DT</td>
                        <td>{{ smartphone.dateSortie | date:'yyyy-MM-dd' }}</td>
                        <td>{{ smartphone.osSmartphone }}</td>
                        <td>
                            <button class ="btn btn-danger btn-sm" (click)="supprimerSmartphone(smartphone)">Supprimer</button>
                            <a class="btn btn-success" btn-sm ms-2 [routerLink]="['/updateSmartphone', smartphone.idSmartphone]">Modifier</a> 
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
