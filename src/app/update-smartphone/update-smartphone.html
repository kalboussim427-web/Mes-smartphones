<div class="container mt-4">
    <div class="card shadow">
        <div class="card-body">
            <h2>Modifier un Smartphone</h2>
            <hr>
            <form *ngIf="currentSmartphone">
                <div class="mb-3">
                    <label class="form-label">ID Smartphone</label>
                    <input type="number" [(ngModel)]="currentSmartphone.idSmartphone" name="idSmartphone" class="form-control" readonly>
                </div>
                <div class="mb-3">
                    <label class="form-label">Modèle</label>
                    <input type="text" class="form-control" [(ngModel)]="currentSmartphone.nomSmartphone" name="modeleSmartphone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Prix</label>
                    <input type="number" class="form-control" [(ngModel)]="currentSmartphone.prixSmartphone" name="prixSmartphone">
                </div>
                <div class="mb-3">
                    <label class="form-label">Date de Sortie</label>
                    <input type="date" class="form-control" [(ngModel)]="currentSmartphone.dateSortie" name="dateSortie">
                </div>
                <div class="mb-3">
                    <label class="form-label">OS</label>
                    <input type="text" class="form-control" [(ngModel)]="currentSmartphone.osSmartphone" name="osSmartphone">
                </div>
                <div class="mt-3">
                    <button type="submit" class="btn btn-success" (click)="updateSmartphone()">Modifier</button>
                </div>
            </form>
        </div>
    </div>
</div>
