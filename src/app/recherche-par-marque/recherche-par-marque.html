<div class="container mt-3">
  <form class="form-inline mb-4">
    <div class="form-group mx-sm-3 mb-2 mt-2">
      <label class="mr-2">Marque : </label>
      <select class="form-control" name="idMarque" [(ngModel)]="idMarque" (change)="onChange()">
        @for (m of marques; track m.idMarque) {
          <option [value]="m.idMarque">{{m.nomMarque}}</option>
        }
      </select>
    </div>
  </form>

  <div class="card shadow mb-4">
    <div class="card-body">
      <table class="table table-striped">
        <thead>
          <tr>
            <th>Id</th><th>Nom</th><th>Prix</th><th>Date Sortie</th><th>Os</th><th>Marque</th>
          </tr>
        </thead>
        <tbody>
          @for (smartphone of smartphones; track smartphone.idSmartphone) {
            <tr>
              <td>{{smartphone.idSmartphone}}</td>
              <td>{{smartphone.nomSmartphone}}</td>
              <td>{{smartphone.prixSmartphone}}</td>
              <td>{{smartphone.dateSortie | date:'dd/MM/yyyy'}}</td>
              <td>{{smartphone.osSmartphone}}</td>
              <td>{{smartphone.marque?.nomMarque}}</td>
            </tr>
          }
        </tbody>
      </table>
    </div>
  </div>
</div>
